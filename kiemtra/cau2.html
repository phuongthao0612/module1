<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function soHoanHao(number) {
        let sum = 0
        for (let i = 1; i < number; i++) {
            if (number % i === 0) {
                sum += i;
            }
            if (sum === number) {
                return true
            }
        }
    }

    function check() {
        let number = +prompt("Nhập số")
        while (isNaN(number) || number < 0) {
            alert("Nhập lại số")
            number = +prompt("Nhập số")
        }
        let result = soHoanHao(number)
        if (result) {
            document.write(`Số: ${number} là số hoàn hảo`)
        } else {
            document.write(`Số: ${number} không phải là số hoàn hảo`)
        }
    }

    check();
</script>

</body>
</html>
